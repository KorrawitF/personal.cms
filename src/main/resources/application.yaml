spring:
  application:
    name: cms
  config:
    import: optional:file:.env[.properties]
  datasource:
    host: ${DATABASE_HOST:localhost}
    port: ${DATABASE_PORT:5432}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASS:}
    database: ${DATABASE_NAME:cms}
    mode: ${DATABASE_MODE:disable}
    ssl: ${DATABASE_SSL:false}
server:
  port: ${SERVER_PORT:80}

app:
  mail:
    host: ${MAIL_HOST:smtp-mail.outlook.com}
    port: ${MAIL_PORT:587}
    from: ${MAIL_FROM:}
    oauth2:
      client-id: ${MAIL_CLIENT_ID:}
      refresh-token: ${MAIL_REFRESH_TOKEN:}
      scope: ${MAIL_SCOPE:https://outlook.office.com/SMTP.Send offline_access}
      token-url: ${MAIL_TOKEN_URL:https://login.microsoftonline.com/consumers/oauth2/v2.0/token}
  s3:
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style-access: ${S3_PATH_STYLE_ACCESS:false}

logging:
  level:
    "[org.springframework.boot.SpringApplication]": off
